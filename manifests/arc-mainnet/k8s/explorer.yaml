# Arc mainnet explorer data plane: every USDC movement and the Uniswap v4
# PoolManager, whole history (startBlock 0 backfills from genesis).
#
# Every USDC value movement is logged once by 0xff…fe — a plain value send,
# value passed into a call, and the twin of each ERC-20 transfer through
# 0x3600…0000 that moves value (same parties, 18 decimals) — so indexing that
# one log covers USDC without double counting. Zero-value ERC-20 transfers
# (often address-poisoning spam) and ERC-20 self-transfers have no native twin
# and are not indexed here; index 0x3600…0000 too if they must appear. Needs a Secret pg-dsn (see ../../arc-testnet/k8s/pg-dsn-secret.example.yaml).
#
# Lanes (spec.insights) start 100 blocks before the head when the insight loop
# first runs: without a startBlock they would start at the indexer's start —
# block 0 here — and classify the whole history. They are read by the Arc
# Laya gate on the host (the one Arc Radar uses, reached as host.k3d.internal
# from k3d), with its token in a Secret made by hand, never committed:
#   kubectl create secret generic laya-gate \
#     --from-literal=header="Authorization: Bearer $RADAR_TOKEN"
apiVersion: arckive.org/v1alpha1
kind: Indexer
metadata:
  name: arc-explorer
spec:
  network:
    chainId: 5042
    # the public endpoint serves full history and 2,000-block getLogs ranges
    rpc: ["https://rpc.mainnet.arc.io"]
    finalityTag: latest
  storage:
    mode: External
    external:
      dsnSecretRef: { name: pg-dsn, key: url }
    # "latest movements of this address" for the explorer's address pages;
    # fixed when the schema is created
    addressIndexes: true
  polling:
    batchBlocks: 2000
    intervalMs: 1000
  insights:
    laya:
      url: http://host.k3d.internal:8921
      headerSecretRef: { name: laya-gate }
    # block + receipts reads at the head; kept off rpc.mainnet.arc.io, whose
    # per-minute quota ingest already spends
    rpc:
      - https://rpc.blockdaemon.mainnet.arc.io
      - https://rpc.beamrpc.com
      - https://rpc.drpc.mainnet.arc.io
    startBlock: -100
  contracts:
    - name: usdc
      address: "0xfffffffffffffffffffffffffffffffffffffffe"
      startBlock: 0
      events: [Transfer]
      abi:
        inline:
          - type: event
            name: Transfer
            inputs:
              - { name: from, type: address, indexed: true }
              - { name: to, type: address, indexed: true }
              - { name: value, type: uint256, indexed: false }
    - name: poolmanager
      address: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
      startBlock: 0
      events: [Initialize, ModifyLiquidity, Swap, Donate]
      abi:
        inline:
          - type: event
            name: Initialize
            inputs:
              - { name: id, type: bytes32, indexed: true }
              - { name: currency0, type: address, indexed: true }
              - { name: currency1, type: address, indexed: true }
              - { name: fee, type: uint24, indexed: false }
              - { name: tickSpacing, type: int24, indexed: false }
              - { name: hooks, type: address, indexed: false }
              - { name: sqrtPriceX96, type: uint160, indexed: false }
              - { name: tick, type: int24, indexed: false }
          - type: event
            name: ModifyLiquidity
            inputs:
              - { name: id, type: bytes32, indexed: true }
              - { name: sender, type: address, indexed: true }
              - { name: tickLower, type: int24, indexed: false }
              - { name: tickUpper, type: int24, indexed: false }
              - { name: liquidityDelta, type: int256, indexed: false }
              - { name: salt, type: bytes32, indexed: false }
          - type: event
            name: Swap
            inputs:
              - { name: id, type: bytes32, indexed: true }
              - { name: sender, type: address, indexed: true }
              - { name: amount0, type: int128, indexed: false }
              - { name: amount1, type: int128, indexed: false }
              - { name: sqrtPriceX96, type: uint160, indexed: false }
              - { name: liquidity, type: uint128, indexed: false }
              - { name: tick, type: int24, indexed: false }
              - { name: fee, type: uint24, indexed: false }
          - type: event
            name: Donate
            inputs:
              - { name: id, type: bytes32, indexed: true }
              - { name: sender, type: address, indexed: true }
              - { name: amount0, type: uint256, indexed: false }
              - { name: amount1, type: uint256, indexed: false }
