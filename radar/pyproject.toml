[project]
name = "arc-radar"
version = "0.1.0"
description = "Every USDC transfer on Arc, typed by a local decision model"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
