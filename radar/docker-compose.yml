services:
  radar:
    build: .
    ports:
      - "8777:8777"
    environment:
      # The model gate on the Mac, published by the Cloudflare Tunnel the
      # ledger radar already runs. Bearer RADAR_TOKEN is required.
      LAYA_ENDPOINT: ${LAYA_ENDPOINT:-https://laya-gate.brages.uk}
      RADAR_TOKEN: ${RADAR_TOKEN:?set RADAR_TOKEN}
      ARC_RPCS: ${ARC_RPCS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
